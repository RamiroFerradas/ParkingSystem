# CI: unit + DB + RPC/sync smoke + e2e de navegador + e2e HTTP.
# Espeja el flujo local sobre Postgres 16: migraciones en `public` (app y smoke)
# y en `dev` (tests de base), build next y suites contra el servidor.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parking
          POSTGRES_PASSWORD: parking_dev
          POSTGRES_DB: parking
          TZ: America/Argentina/Cordoba
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U parking -d parking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgres://parking:parking_dev@localhost:5433/parking
      AUTH_SECRET: ci-test-secret-not-for-production
      BASE: http://localhost:3000
      # `tests/db/*` defaults to the `dev` schema and refuses `public`.
      TEST_SCHEMA: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Unit tests (vitest)
        run: pnpm test:unit

      - name: Aplicar migraciones (public + dev)
        run: node scripts/ci-migrate.mjs public dev

      - name: DB tests (tests/db, schema dev)
        run: pnpm test:db

      - name: RPCs smoke (D)
        run: node scripts/test-rpcs.mjs

      - name: Sync worker smoke (D6)
        run: node scripts/test-sync.mjs

      - name: Instalar Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E de navegador (Playwright)
        env:
          E2E_DATABASE_URL: postgres://parking:parking_dev@localhost:5433/parking
          E2E_SCHEMA: test_e2e_ci
        run: pnpm test:e2e

      - name: Subir trazas si falla Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Servidor en :3000
        run: |
          pnpm start &
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf http://localhost:3000/login > /dev/null; then echo listo; break; fi
          done

      - name: e2e (71 checks)
        run: node scripts/test-e2e.mjs
